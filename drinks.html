  /* ──────────────────────────────────────
     HERO — foto guinness
  ────────────────────────────────────── */

  .sob-hero-content {

  .sob-eyebrow {

  /* ──────────────────────────────────────
     NAV CATEGORÍAS — sticky bajo el hero
  ────────────────────────────────────── */

    top: 0 !important; bottom: auto !important;
    left: 0 !important; right: 0 !important;
    transform: none !important;
    width: 100% !important; max-width: 100% !important;
    min-height: auto !important; border-radius: 0 !important;
    z-index: 200 !important;
    overflow: visible !important;

    background: rgba(8,8,8,0.97) !important;
    border: none !important;
    border-bottom: 1px solid rgba(255,255,255,0.07) !important;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    display: block !important;
    padding: 0 !important;
  }
  .bottom-nav::before { display: none !important; }
  .pub-nav-header      { display: none !important; }

  .nav-scroll {
    display: flex !important;
    align-items: center !important;
    gap: 0.3rem !important;
    overflow-x: auto !important;
    overflow-y: visible !important;
    -webkit-overflow-scrolling: touch !important;
    scrollbar-width: none !important;
    padding: 0.5rem clamp(0.8rem, 3vw, 1.5rem) !important;
    background: transparent !important;
    /* evitar que el sticky padre corte los tabs */
    clip: unset !important;
    clip-path: none !important;
  }
  .nav-scroll::-webkit-scrollbar { display: none !important; }

  .nav-tab {
    flex: 0 0 auto !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0.45rem clamp(0.75rem, 2vw, 1.1rem) !important;
    font-family: 'DM Sans', sans-serif !important;

    background: rgba(255,255,255,0.04) !important;
    border: 1px solid rgba(255,255,255,0.07) !important;
    border-radius: 20px !important;
    white-space: nowrap !important;

    transition: color 0.18s, background 0.18s, border-color 0.18s !important;

  /* ──────────────────────────────────────
     ANTI-CLIP — anula overflow:hidden del Vue
     en todos los contenedores de contenido
  ────────────────────────────────────── */
  .app-shell,
  .view,
  .section-wrapper,
  .group,
  .products,
  .product-card,
  .product-main,
  .product-heading,
  .description,
  .price-stack,
  .price-pill,
  .banner,
  .deal-grid,
  .deal-card {
    overflow: visible !important;
    max-height: none !important;
    clip: unset !important;
    clip-path: none !important;
  }


  /* ──────────────────────────────────────
     APP-SHELL / VIEW
  ────────────────────────────────────── */
  .app-shell {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #0c0c0c !important;
    min-height: 0 !important;
  }

  .view {
    max-width: 1040px !important;
    margin: 0 auto !important;
    padding: 0 clamp(1rem, 4vw, 2rem) 6rem !important;
    background: transparent !important;
    min-height: 0 !important;
    color: rgba(255,255,255,0.8) !important;
    counter-reset: sob-sec !important;
  }


  /* ──────────────────────────────────────
     SECCIONES
  ────────────────────────────────────── */
  .section-wrapper {
    padding-top: clamp(2.5rem, 5vw, 4rem) !important;
    counter-increment: sob-sec !important;
    position: relative !important;
  }
  .section-wrapper::before { display: none !important; }
  .section-wrapper + .section-wrapper {
    border-top: 1px solid rgba(255,255,255,0.05) !important;
  }

  .section-kicker { display: none !important; }

  /* Cabecera de sección */
  .section-heading {
    display: flex !important;
    align-items: baseline !important;
    gap: 0.8rem !important;
    margin: 0 0 0.35rem !important;
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: clamp(0.5rem, 1vw, 0.58rem) !important;
    font-weight: 700 !important;
    letter-spacing: 5px !important;
    text-transform: uppercase !important;
    color: rgba(255,255,255,0.45) !important;
    line-height: 1 !important;
  }
  /* Número de sección pequeño */
  .section-heading::before {
    content: counter(sob-sec, decimal-leading-zero) !important;
    font-family: 'Cinzel', serif !important;
    font-size: 0.65rem !important;
    font-weight: 400 !important;
    color: rgba(219,168,42,0.35) !important;
    flex-shrink: 0 !important;
  }
  /* Línea dorada bajo el título */
  .section-heading::after {
    content: '' !important;
    flex: 1 !important;
    height: 1px !important;
    background: rgba(219,168,42,0.18) !important;
    display: block !important;
    margin-bottom: 0.1rem !important;
  }

  .section-subtitle { display: none !important; }


  /* ──────────────────────────────────────
     BANNER — ocultar todo el bloque
     Solo mostramos título y subtítulo
     en la cabecera de sección ya visible
  ────────────────────────────────────── */
  .banner {
    display: none !important;
  }


  /* ──────────────────────────────────────
     GRUPOS
  ────────────────────────────────────── */
  .group {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
  }
  .group + .group {
    padding-top: clamp(0.5rem, 1.5vw, 0.8rem) !important;
  }

  .group-title {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 0.55rem !important;
    font-weight: 700 !important;
    letter-spacing: 3.5px !important;
    text-transform: uppercase !important;
    color: rgba(255,255,255,0.16) !important;
    margin: clamp(0.6rem, 1.5vw, 0.9rem) 0 0.4rem !important;
    padding: 0 !important;
  }
  .group-title::before, .group-title::after { display: none !important; }

  .products {
    display: block !important;
    background: transparent !important;
  }


  /* ──────────────────────────────────────
     FILA DE PRODUCTO
     Nombre izquierda — precio derecha
  ────────────────────────────────────── */
  .product-card {
    display: flex !important;
    flex-direction: row !important;
    align-items: flex-start !important;
    justify-content: space-between !important;
    gap: 0.8rem !important;
    padding: clamp(0.65rem, 1.5vw, 0.85rem) 0 !important;
    background: transparent !important;
    border: none !important;
    border-bottom: 1px solid rgba(255,255,255,0.05) !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    break-inside: avoid !important;
    transition: background 0.15s !important;
    overflow: visible !important;
    min-height: 0 !important;
  }
  .product-card:last-child { border-bottom: none !important; }
  .product-card::before { display: none !important; }
  .product-card::after  { display: none !important; }
  .product-card:hover   { background: rgba(255,255,255,0.02) !important; }
  .product-card.is-highlighted {
    background: rgba(219,168,42,0.04) !important;
    border-left: 2px solid rgba(219,168,42,0.35) !important;
    padding-left: 0.7rem !important;
    margin-left: -0.7rem !important;
  }

  /* Zona del nombre */
  .product-main {
    flex: 1 !important;
    min-width: 0 !important;
    display: block !important;
  }
  .product-main::after { display: none !important; }

  .product-heading {
    display: flex !important;
    align-items: center !important;
    gap: 0.45rem !important;
    flex-wrap: wrap !important;
  }

  .product-name {
    font-family: 'DM Sans', sans-serif !important;
    font-size: clamp(0.85rem, 1.6vw, 0.95rem) !important;
    font-weight: 400 !important;
    color: rgba(255,255,255,0.85) !important;
    line-height: 1.2 !important;
    margin: 0 !important;
  }

  .badge {
    display: inline-flex !important;
    align-items: center !important;
    padding: 0.05rem 0.35rem !important;
    border: 1px solid rgba(219,168,42,0.22) !important;
    color: rgba(219,168,42,0.5) !important;
    background: transparent !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 0.42rem !important;
    font-weight: 700 !important;
    letter-spacing: 1.5px !important;
    text-transform: uppercase !important;
    border-radius: 2px !important;
    flex-shrink: 0 !important;
  }

  .description {
    display: block !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: clamp(0.72rem, 1.3vw, 0.78rem) !important;
    font-weight: 300 !important;
    color: rgba(255,255,255,0.28) !important;
    margin: 0.25rem 0 0 !important;
    line-height: 1.45 !important;
    white-space: normal !important;
    word-break: normal !important;
    overflow-wrap: break-word !important;
    overflow: visible !important;
    max-width: 100% !important;
    max-height: none !important;
  }


  /* ──────────────────────────────────────
     PRECIOS — derecha, columnas verticales
  ────────────────────────────────────── */
  .price-stack {
    flex-shrink: 0 !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: flex-start !important;
    gap: 0 !important;
    padding-top: 0.15rem !important;
  }

  .price-pill {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-end !important;
    padding: 0 clamp(0.35rem, 0.8vw, 0.55rem) !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    white-space: nowrap !important;
    min-width: 0 !important;
    min-height: 0 !important;

  .price-pill:first-child { padding-left: 0 !important; }
  .price-pill:last-child  { padding-right: 0 !important; }
  .price-pill + .price-pill {
    border-left: 1px solid rgba(255,255,255,0.07) !important;

  .price-pill.is-muted { opacity: 0.25 !important; }

  .price-label {
    font-family: 'DM Sans', sans-serif !important;
    font-size: clamp(0.38rem, 0.7vw, 0.42rem) !important;
    font-weight: 600 !important;
    letter-spacing: 1.5px !important;
    text-transform: uppercase !important;
    color: rgba(255,255,255,0.18) !important;
    line-height: 1 !important;
    margin-bottom: 0.1rem !important;
  }
  .price-value {
    font-family: 'DM Sans', sans-serif !important;
    font-size: clamp(0.88rem, 1.5vw, 1rem) !important;
    font-weight: 700 !important;
    color: #dba82a !important;
    line-height: 1 !important;
    margin: 0 !important;
  }


  /* ──────────────────────────────────────
     DEAL GRID
  ────────────────────────────────────── */
  .deal-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(clamp(100px, 22vw, 150px), 1fr)) !important;
    gap: 1px !important;
    background: rgba(255,255,255,0.06) !important;
    margin: clamp(0.3rem, 1vw, 0.6rem) 0 !important;
    overflow: hidden !important;
    border-radius: 4px !important;
  }
  .deal-card {
    background: #0c0c0c !important;
    padding: clamp(0.8rem, 2vw, 1.1rem) clamp(0.6rem, 1.5vw, 0.9rem) !important;
    text-align: center !important;
    border: none !important;
    border-radius: 0 !important;
    transition: background 0.15s !important;
  }
  .deal-card:hover { background: rgba(219,168,42,0.05) !important; }
  .deal-card .product-name {
    font-size: clamp(0.78rem, 1.4vw, 0.88rem) !important;
    color: rgba(255,255,255,0.82) !important;
    text-align: center !important;
  }
  .deal-price {
    display: block !important;
    margin-top: 0.3rem !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: clamp(1rem, 2vw, 1.2rem) !important;
    font-weight: 700 !important;
    color: #dba82a !important;
  }
  .deal-grid img { display: none !important; }


  /* ──────────────────────────────────────
     FOOTER
  ────────────────────────────────────── */
  .sob-footer {
    text-align: center;
    padding: 2.5rem 1rem 4rem;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 0;
  }
  .sob-footer p {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.42rem, 0.9vw, 0.52rem);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(219,168,42,0.2);
    margin: 0;
  }




  /* ──────────────────────────────────────
     RESPONSIVE — TABLET 600–899px
  ────────────────────────────────────── */
  @media (min-width: 600px) {
    .products {
      column-count: 2 !important;
      column-gap: clamp(1.5rem, 4vw, 2.5rem) !important;
      column-rule: 1px solid rgba(255,255,255,0.04) !important;
    }
    .product-card { break-inside: avoid !important; }
  }


  /* ──────────────────────────────────────
     RESPONSIVE — DESKTOP ≥ 900px
  ────────────────────────────────────── */
  @media (min-width: 900px) {
    .view { padding: 0 clamp(1.5rem, 3vw, 2.5rem) 6rem !important; }

    .section-heading { font-size: 0.6rem !important; letter-spacing: 6px !important; }

    .products {
      column-count: 2 !important;
      column-gap: 3rem !important;
    }

    .price-value { font-size: 1rem !important; }
  }


  /* ──────────────────────────────────────
     RESPONSIVE — WIDE ≥ 1200px
  ────────────────────────────────────── */
  @media (min-width: 1200px) {
    .view { max-width: 1100px !important; }
    .products { column-count: 3 !important; column-gap: 3.5rem !important; }
  }

  </style>
</head>
